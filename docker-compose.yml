services:
  db:
    image: postgres:17-alpine
    container_name: querylab-postgres
    environment:
      POSTGRES_DB: querylab
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init/01_seed_orders.sql:/docker-entrypoint-initdb.d/01_seed_orders.sql:ro
      - ./db/scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d querylab"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 5s

  app:
    build: .
    container_name: querylab-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/querylab
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
